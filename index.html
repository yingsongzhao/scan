<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学习机 · 题目识别</title>
<style>
:root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#243a30;background:#f5f7f4}*{box-sizing:border-box}body{margin:0}header{padding:18px max(18px,5vw);background:#fff;border-bottom:1px solid #e0e8e0;display:flex;align-items:center;justify-content:space-between}header strong{font-size:19px}header span{color:#718276;font-size:12px}main{max-width:1250px;padding:30px 18px 60px;margin:auto}h1{font-size:29px;margin:0 0 8px}p{color:#687c70;line-height:1.7;margin:0 0 18px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid #dee8df;border-radius:14px;overflow:hidden}.title{padding:16px 20px;border-bottom:1px solid #e6ebe6;font-weight:700}.body{padding:18px}.stage{height:370px;border:1px dashed #adc4b2;border-radius:9px;background:#f8faf7;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;touch-action:none;cursor:crosshair}.stage canvas{max-width:100%;max-height:100%;object-fit:contain;display:none}.stage.ready canvas{display:block}.stage.ready .empty{display:none}.empty{text-align:center;color:#6d8072;cursor:pointer}.empty b{display:block;font-size:17px;color:#315f4d;margin-bottom:9px}.selection{position:absolute;pointer-events:none;border:2px solid #f2994a;background:#f2994a33;display:none}.hint{font-size:12px;margin:11px 0;color:#77887c}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}button,select{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid #cddbd0;background:white;color:#294a35;cursor:pointer}button:hover{background:#f1f6f0}button.primary{background:#315f4d;border-color:#315f4d;color:white}button.primary:hover{background:#224d3b}button:disabled{opacity:.5;cursor:not-allowed}label{font-size:13px;color:#526d58}select{max-width:100%;font-size:13px}textarea{width:100%;height:370px;resize:vertical;border:1px solid #dbe5db;border-radius:8px;padding:15px;font:14px/1.85 "Microsoft YaHei",sans-serif;color:#263c30;outline:none}textarea:focus{border-color:#478560}.status{font-size:12px;color:#597562;min-height:20px}.warning{background:#fff8eb;border:1px solid #f0dfb8;border-radius:8px;padding:12px;color:#805f29;font-size:12px;line-height:1.7}.output{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}#printPage{display:none}#printText{white-space:pre-wrap;overflow-wrap:anywhere}#printFigure{max-width:100%;max-height:220mm;object-fit:contain;display:block;margin-top:12mm}#printFigure[hidden]{display:none}@media(max-width:820px){.cols{grid-template-columns:1fr}.stage{height:300px}}@media print{header,main{display:none!important}#printPage{display:block!important;color:#000;font:12pt/1.7 "Microsoft YaHei",sans-serif;margin:15mm 10mm}}
</style></head><body><header><strong>学习机 · 题目识别</strong><span>教师工作台 · 题目整理</span></header><main><h1>把图片题目，整理成可编辑文本</h1><p>先选图片，必要时旋转或拖框只识别题目区域；自动识别语言和题目类型，校对无误后复制、下载或打印。</p><div class="cols"><section class="card"><div class="title">01　准备题目图片</div><div class="body"><div class="stage" id="stage"><div class="empty"><b>＋ 选择图片或拖进这里</b>支持 JPG、PNG、WEBP · 单张不超过 15 MB</div><canvas id="canvas" aria-label="图片预览；在图片上拖动可圈选识别区域"></canvas><div class="selection" id="selection"></div></div><input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden><div class="hint" id="filename">尚未选择图片。圈选区域仅影响识别，不会修改原文件。</div><div class="tools"><button id="choose">选择图片</button><button id="rotate" disabled>↻ 顺时针旋转</button><button id="clearCrop" disabled>清除选区</button></div><div class="tools"><label for="processing">图像处理</label><select id="processing"><option value="original">原图（默认）</option><option value="enhanced">放大并增强对比度（可试）</option></select></div><div class="tools"><button id="saveFigure" disabled>▧ 加入原图插图（可添加图1、图2）</button><button id="removeFigure" disabled>移除插图</button></div><div class="hint">只保留手动加入原图：圈选需要的插图后点击“加入原图插图”；也可以使用右侧“04 几何绘图板”画图并加入题目。</div><button id="recognize" class="primary" disabled>✦ 开始识别</button></div></section><section class="card"><div class="title">02　识别结果 · 请对照原图校对</div><div class="body"><textarea id="editor" spellcheck="false" placeholder="识别结果将在这里显示；可直接改字、补公式和调整选项。"></textarea><div id="figureWrap" hidden><div class="hint">题目插图（来自你框选的原图区域，可随题目一起打印和保存 HTML）</div><img id="figurePreview" alt="从原始题目中截取的几何图" style="max-width:100%;max-height:200px;border:1px solid #dbe5db;border-radius:8px"></div><div class="tools"><button id="copy">复制文本</button><button id="download">下载 TXT（纯文本）</button><button id="downloadHtml">预览 HTML</button><button id="print" class="primary">打印题目和插图</button></div><div id="status" class="status" role="status" aria-live="polite">等待导入图片</div></div></section></div></main><div id="printPage"><div id="printText"></div><img id="printFigure" alt="题目插图" hidden></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),stage=$('stage'),canvas=$('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),editor=$('editor'),select=$('selection');let img=null,imageURL=null,angle=0,crop=null,drag=null,running=false,lastOCR='',chosen=null,figureData='';const status=s=>$('status').textContent=s;const buttons=()=>{const enabled=!!img&&!running;$('rotate').disabled=!enabled;$('recognize').disabled=!enabled;$('clearCrop').disabled=!enabled||!crop;$('saveFigure').disabled=!enabled||!crop;$('removeFigure').disabled=!figureData};function paint(){if(!img)return;const swap=angle%180!==0;canvas.width=swap?img.naturalHeight:img.naturalWidth;canvas.height=swap?img.naturalWidth:img.naturalHeight;ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.save();ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(angle*Math.PI/180);ctx.drawImage(img,-img.naturalWidth/2,-img.naturalHeight/2);ctx.restore();stage.classList.add('ready');drawCrop()}
function drawCrop(){if(!crop){select.style.display='none';buttons();return}const r=canvas.getBoundingClientRect(),s=stage.getBoundingClientRect();Object.assign(select.style,{display:'block',left:(r.left-s.left+crop.x*r.width)+'px',top:(r.top-s.top+crop.y*r.height)+'px',width:(crop.w*r.width)+'px',height:(crop.h*r.height)+'px'});buttons()}
function position(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}}function box(a,b){return{x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(a.x-b.x),h:Math.abs(a.y-b.y)}}
canvas.addEventListener('pointerdown',e=>{if(!img||running)return;drag=position(e);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;crop=box(drag,position(e));drawCrop()});canvas.addEventListener('pointerup',e=>{if(!drag)return;crop=box(drag,position(e));drag=null;if(crop.w<.02||crop.h<.02)crop=null;drawCrop();status(crop?'仅识别框内区域':'已清除小范围选区')});canvas.addEventListener('pointercancel',()=>{drag=null});addEventListener('resize',drawCrop);
async function setFile(f){if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)){status('请选择 JPG、PNG 或 WEBP 图片');return}if(f.size>15*1024*1024){status('图片超过 15 MB，请压缩后重试');return}if(imageURL)URL.revokeObjectURL(imageURL);imageURL=URL.createObjectURL(f);let next=new Image();next.onload=()=>{img=next;angle=0;crop=null;chosen=f;figureData='';if(window.clearMathFigures)window.clearMathFigures();$('figureWrap').hidden=true;buttons();paint();$('filename').textContent=f.name+' · '+Math.round(f.size/1024)+' KB';status('图片已就绪；拖框选择题目正文可避开答案和批注')};next.onerror=()=>status('无法读取这张图片');next.src=imageURL}
$('choose').onclick=()=>$('file').click();stage.addEventListener('click',e=>{if(!img&&e.target!==canvas)$('file').click()});$('file').onchange=e=>{setFile(e.target.files[0]);e.target.value=''};for(const type of ['dragover','drop'])stage.addEventListener(type,e=>e.preventDefault());stage.addEventListener('drop',e=>setFile(e.dataTransfer.files[0]));$('rotate').onclick=()=>{angle=(angle+90)%360;crop=null;paint();status('已实际旋转识别图像 '+angle+'°')};$('clearCrop').onclick=()=>{crop=null;drawCrop();status('已改为识别整张图片')};
$('saveFigure').onclick=()=>{if(!crop||!img)return status('请先在原图框出要保存的几何图');const b=crop,c=document.createElement('canvas');c.width=Math.max(1,Math.round(b.w*canvas.width));c.height=Math.max(1,Math.round(b.h*canvas.height));c.getContext('2d').drawImage(canvas,Math.round(b.x*canvas.width),Math.round(b.y*canvas.height),c.width,c.height,0,0,c.width,c.height);figureData=c.toDataURL('image/png');$('figurePreview').src=figureData;$('figureWrap').hidden=false;buttons();status('已保存原题插图；请圈选下一张图。导出会替换对应的文字占位符');crop=null;drawCrop()};$('removeFigure').onclick=()=>{figureData='';$('figureWrap').hidden=true;buttons();status('已移除题目插图')};
function prepare(){const b=crop||{x:0,y:0,w:1,h:1},x=Math.floor(b.x*canvas.width),y=Math.floor(b.y*canvas.height),w=Math.max(1,Math.ceil(b.w*canvas.width)),h=Math.max(1,Math.ceil(b.h*canvas.height)),enhanced=$('processing').value==='enhanced',factor=enhanced?Math.min(2,Math.max(1,1800/Math.max(w,h))):1,c=document.createElement('canvas');c.width=Math.round(w*factor);c.height=Math.round(h*factor);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.imageSmoothingQuality='high';g.drawImage(canvas,x,y,w,h,0,0,c.width,c.height);if(enhanced){const data=g.getImageData(0,0,c.width,c.height),p=data.data;for(let i=0;i<p.length;i+=4){for(let k=0;k<3;k++)p[i+k]=Math.max(0,Math.min(255,(p[i+k]-128)*1.12+128))}g.putImageData(data,0,0)}return c}
async function qwenRecognize(target){const dataURL=target.toDataURL('image/jpeg',0.91);const response=await fetch('/api/recognize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({imageBase64:dataURL.split(',')[1]})});let data;try{data=await response.json()}catch{throw Error('无法连接识别服务；请通过本地 Node 服务打开网页')}if(!response.ok)throw Error(data.error||'模型识别失败');return data.text}
$('recognize').onclick=async()=>{if(!img||running)return;if(editor.value.trim()&&editor.value!==lastOCR&&!confirm('当前有手动编辑的文字，重新识别会覆盖它。继续吗？'))return;running=true;buttons();try{status('正在识别题目…');const text=await qwenRecognize(prepare());if(!text){status('未识别到文字，请选择清晰图片');return}editor.value=text;lastOCR=text;if(window.refreshMathPreview)window.refreshMathPreview();status('识别完成')}catch(err){console.error(err);status('识别失败：'+(err.message||'请检查服务配置'))}finally{running=false;buttons()}};
$('copy').onclick=async()=>{if(!editor.value)return status('没有可复制的文字');const plain=window.mathPlainText?window.mathPlainText(editor.value):editor.value;try{await navigator.clipboard.writeText(plain);status('已复制纯文本')}catch{editor.select();status(document.execCommand('copy')?'已复制':'无法访问剪贴板，请手动复制')}};$('download').onclick=()=>{if(!editor.value)return status('没有可下载的文字');const plain=window.mathPlainText?window.mathPlainText(editor.value):editor.value;const u=URL.createObjectURL(new Blob(['\ufeff'+plain],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=(chosen?chosen.name.replace(/\.[^.]+$/,''):'题目')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('downloadHtml').onclick=()=>{if(!editor.value&&!figureData)return status('没有可保存的题目内容');const escape=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');const doc='<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>题目整理</title><style>body{max-width:800px;margin:30px auto;padding:0 20px;font:16px/1.8 "Microsoft YaHei",sans-serif}pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}img{max-width:100%;height:auto}</style><pre>'+escape(editor.value)+'</pre>'+(figureData?'<img alt="原题插图" src="'+figureData+'">':'')+'</html>';const u=URL.createObjectURL(new Blob([doc],{type:'text/html;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=(chosen?chosen.name.replace(/\.[^.]+$/,''):'题目')+'-图文.html';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);status('已保存可编辑文字与原题插图的 HTML 文件')};$('print').onclick=()=>{if(!editor.value&&!figureData)return status('没有可打印的题目');$('printText').textContent=editor.value;$('printFigure').hidden=!figureData;if(figureData)$('printFigure').src=figureData;print()};
})();
</script><script src="/ocr-format.js"></script><script src="/math-layout.js"></script><script src="/geometry-board.js"></script><script src="/tablet-workspace.js"></script></body></html>
